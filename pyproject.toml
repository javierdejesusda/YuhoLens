[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yuholens"
version = "0.1.0"
description = "Japanese Yuho-specific LLM with span-level English memo citations on AMD MI300X."
authors = [{ name = "Javier De Jesus", email = "javier.dejesusj9@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
keywords = [
    "yuho",
    "edinet",
    "japanese-finance",
    "nekomata",
    "qwen",
    "rocm",
    "mi300x",
    "amd",
    "langgraph",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "torch==2.5.1",
    "transformers==4.48.0",
    "accelerate==1.3.0",
    "trl>=1.2.0,<2.0.0",
    "peft==0.14.0",
    "datasets==3.2.0",
    "sentencepiece==0.2.0",
    "tiktoken==0.8.0",
    "einops==0.8.0",
    "langgraph==0.2.60",
    "langchain==0.3.14",
    "langchain-core==0.3.29",
    "openai>=1.50",
    "pydantic>=2.9,<3.0",
    "pyyaml>=6.0.2",
    "tqdm>=4.67",
    "python-dotenv>=1.0.1",
    "rich>=13.9",
    "huggingface_hub>=0.25",
    "safetensors>=0.4.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.13",
    "types-PyYAML",
    "langdetect>=1.0.9",
    "pre-commit>=3.8",
]
release = [
    "huggingface_hub>=0.25",
    "safetensors>=0.4.5",
    "matplotlib>=3.9",
]
serve = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
rocm = [
    "deepspeed>=0.16",
]

[project.urls]
Repository = "https://github.com/javierdejesusda/YuhoLens"
Documentation = "https://github.com/javierdejesusda/YuhoLens#readme"
Issues = "https://github.com/javierdejesusda/YuhoLens/issues"
ModelCard = "https://huggingface.co/yuholens/yuholens-14b"
Changelog = "https://github.com/javierdejesusda/YuhoLens/blob/main/docs/CHANGELOG.md"

[project.scripts]
yuholens-agents = "yuholens.agents.cli:main"
yuholens-check-release = "yuholens.tools.check_release:main"
yuholens-bestofn-offline = "yuholens.tools.bestofn_offline:main"
yuholens-hf-upload = "yuholens.tools.hf_upload:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yuholens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/yuholens"]
omit = [
    "src/yuholens/training/*",
    "src/yuholens/compat/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "D",
]
ignore = [
    "D203",
    "D213",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
