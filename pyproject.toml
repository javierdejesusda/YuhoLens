[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yuholens"
version = "0.1.0"
description = "Japanese Yuho-specific LLM with span-level English memo citations on AMD MI300X."
authors = [{ name = "Javier De Jesus", email = "javier.dejesusj9@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
keywords = [
    "yuho",
    "edinet",
    "japanese-finance",
    "nekomata",
    "qwen",
    "rocm",
    "mi300x",
    "amd",
    "langgraph",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "torch==2.5.1",
    "transformers==4.48.0",
    "accelerate==1.3.0",
    "trl>=1.2.0,<2.0.0",
    "peft==0.14.0",
    "datasets==3.2.0",
    "sentencepiece==0.2.0",
    "tiktoken==0.8.0",
    "einops==0.8.0",
    "langgraph==0.2.60",
    "langchain==0.3.14",
    "langchain-core==0.3.29",
    "anthropic==0.42.0",
    "pydantic>=2.9,<3.0",
    "pyyaml>=6.0.2",
    "tqdm>=4.67",
    "python-dotenv>=1.0.1",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.13",
    "types-PyYAML",
]
rocm = [
    "deepspeed>=0.16",
]

[project.urls]
Repository = "https://github.com/javierdejesusda/YuhoLens"

[tool.hatch.build.targets.wheel]
packages = ["src/yuholens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "D",
]
ignore = [
    "D203",
    "D213",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
