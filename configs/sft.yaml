# SFT hyperparameters for YuhoLens-Pipeline Week 1 main run.
# Red-team-corrected: seq 8192 (not 12K) — see build-spec §19.

model_id: pfnet/nekomata-14b-pfn-qfin
train_data: data/teacher/sft_trl.jsonl
output_dir: output/yuholens-14b-sft
per_device_train_batch_size: 1
gradient_accumulation_steps: 32
num_train_epochs: 2
learning_rate: 1.0e-5
max_length: 8192
save_steps: 200

gradient_checkpointing: false
optim: paged_adamw_8bit
bf16_full_eval: true
dataloader_num_workers: 4
dataloader_pin_memory: true
group_by_length: true
remove_unused_columns: false
logging_steps: 10
