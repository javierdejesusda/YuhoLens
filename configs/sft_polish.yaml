# LM-head + last-4-layers polish of the full SFT checkpoint.
# See src/yuholens/training/sft_polish.py for rationale.

base_checkpoint: output/yuholens-14b-sft/checkpoint-212
train_data: data/teacher/sft_trl.jsonl
output_dir: output/yuholens-14b-sft-polish
num_tail_blocks: 4

per_device_train_batch_size: 1
gradient_accumulation_steps: 32
num_train_epochs: 1
learning_rate: 2.0e-6
warmup_steps: 10
max_length: 8192
save_steps: 50

gradient_checkpointing: false
optim: paged_adamw_8bit
bf16_full_eval: true
dataloader_num_workers: 4
dataloader_pin_memory: true
group_by_length: true
remove_unused_columns: false
logging_steps: 10
report_to: none
